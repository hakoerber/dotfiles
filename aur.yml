---
- name: Build AUR packages
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Create build user on arch
      ansible.builtin.user:
        name: makepkg
        home: /var/lib/makepkg
        create_home: true
        shell: /bin/bash
        system: true
      become: true

    - name: copy PKGBUILDS to build user
      copy:
        src: pkgbuilds/
        dest: /var/lib/makepkg/pkgbuilds/
        owner: makepkg
        group: makepkg
        remote_src: true
      become: true

    - ansible.builtin.set_fact:
        aur_packages:
          - name: nodejs-intelephense
          - name: terraform-ls-bin
          - name: grm
          - name: screencfg
          - name: slack-desktop
          - name: claude-code
          - name: cargo-lambda-bin
          - name: nm-sidebar
          - name: portfolio-performance-bin
            preexec: |
              #!/usr/bin/env bash
              source ./env
              curl -sSf --proto '=https' https://keys.openpgp.org/vks/v1/by-fingerprint/E46E6F8FF02E4C83569084589239277F560C95AC | gpg --import -
          - name: spotify
            preexec: |
              #!/usr/bin/env bash
              source ./env
              echo lel
              curl -sSf --proto '=https' https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.gpg | gpg --import -

    - ansible.builtin.set_fact:
        aur_packages: "{{ aur_packages | map(attribute='dependencies', default=[]) | flatten + aur_packages }}"

    - name: Install dependencies
      ansible.builtin.shell: |
        aur_packages=({{ aur_packages | map(attribute='name') | join(' ') }})

        source pkgbuilds/{{ item.name }}/PKGBUILD

        installed=0

        dependencies=(${depends[@]} ${makedepends[@]} ${checkdepends[@]})
        for dep in "${dependencies[@]}" ; do
          aur=0
          for aur_pkg in "${aur_packages[@]}" ; do
            if [[ "${aur_pkg}" == "${dep}" ]] ; then
              aur=1
              break
            fi
          done

          if (( aur )) ; then
            continue
          fi

          if ! pacman -Qq "${dep}" >/dev/null 2>&1 ; then
            installed=1
            pacman -S --noconfirm --needed "${dep}"
          fi
        done

        if (( installed )) ; then
          exit 123
        else
          exit 0
        fi
      args:
        executable: /bin/bash
      register: install_deps
      failed_when: install_deps.rc not in (0, 123)
      changed_when: install_deps.rc == 123
      become: true
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create build root directory
      ansible.builtin.file:
        path: "/var/lib/makepkg/build/"
        state: directory
        mode: "0700"
        owner: makepkg
        group: makepkg
      become_user: makepkg
      become: true

    - name: Create build directory for package
      ansible.builtin.file:
        path: "/var/lib/makepkg/build/{{ item.name }}/"
        state: directory
        mode: "0700"
        owner: makepkg
        group: makepkg
      become_user: makepkg
      become: true
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create build gpg directory
      ansible.builtin.file:
        path: "/var/lib/makepkg/build/{{ item.name }}/gnupg"
        state: directory
        mode: "0700"
        owner: makepkg
        group: makepkg
      become_user: makepkg
      become: true
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create env file
      ansible.builtin.copy:
        dest: /var/lib/makepkg/build/{{ item.name }}/env
        owner: makepkg
        group: makepkg
        mode: "0600"
        content: |
          export GNUPGHOME="/var/lib/makepkg/build/{{ item.name }}/gnupg"
      become_user: makepkg
      become: true
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check preexec script
      ansible.builtin.stat:
        path: /var/lib/makepkg/build/{{ item.name }}/preexec
      become_user: makepkg
      become: true
      when: item.preexec is defined
      loop: "{{ aur_packages }}"
      register: preexec_before
      loop_control:
        label: "{{ item.name }}"

    - name: Install preexec script
      ansible.builtin.copy:
        dest: /var/lib/makepkg/build/{{ item.name }}/preexec
        owner: makepkg
        group: makepkg
        mode: "0700"
        content: "{{ item.preexec }}"
      become_user: makepkg
      become: true
      when: item.preexec is defined
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check preexec script
      ansible.builtin.stat:
        path: /var/lib/makepkg/build/{{ item.name }}/preexec
      become_user: makepkg
      become: true
      when: item.preexec is defined
      loop: "{{ aur_packages }}"
      register: preexec_after
      loop_control:
        label: "{{ item.name }}"

    - name: Run preexec script # noqa: no-changed-when
      ansible.builtin.command:
        cmd: "{{ item.1.stat.path }}"
        chdir: "{{ item.1.stat.path | dirname }}"
      become_user: makepkg
      become: true
      when: not item[0].stat.exists or (item[0].stat.checksum | default('') != item[1].stat.checksum)
      loop: "{{ preexec_before.results | reject('skipped') | zip(preexec_after.results | reject('skipped')) }}"
      loop_control:
        label: "{{ item.1.stat.path }}"

    - name: Create build script
      ansible.builtin.copy:
        owner: makepkg
        group: makepkg
        mode: "0700"
        dest: /var/lib/makepkg/build/{{ item.name }}/build.sh
        content: |
          #!/usr/bin/env bash

          source /var/lib/makepkg/build/{{ item.name }}/env

          export PKGEXT='.pkg.tar'
          export BUILDDIR=/var/lib/makepkg/build/{{ item.name }}/build/
          export SRCDEST=/var/lib/makepkg/build/{{ item.name }}/src/
          export PKGDEST=/var/lib/makepkg/build/{{ item.name }}/

          cd /var/lib/makepkg/pkgbuilds/{{ item.name }}/

          source ./PKGBUILD

          for a in "${arch[@]}" ; do
            if [[ "${a}" == "any" ]] ; then
              arch="any"
              break
            fi
            if [[ "${a}" == "x86_64" ]] ; then
              arch="x86_64"
              break
            fi
          done

          if [[ ! "${arch}" ]] ; then
            printf 'unsupported arch\n' >&2
            exit 1
          fi

          if [[ "${epoch}" ]] ; then
            version="${epoch}:${pkgver}-${pkgrel}"
          else
            version="${pkgver}-${pkgrel}"
          fi

          filename="${PKGDEST%/}/${pkgname}-${version}-${arch}${PKGEXT}"

          if [[ ! -e "${filename}" ]] ; then
            makepkg \
              --clean \
              --nosign || exit 1
          fi

          printf '%s' "${filename}" > /var/lib/makepkg/build/{{ item.name }}/pkgname
      become: true
      become_user: makepkg
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create install script
      ansible.builtin.copy:
        owner: root
        group: root
        mode: "0700"
        dest: /var/lib/makepkg/build/{{ item.name }}/install.sh
        content: |
          #!/usr/bin/env bash

          sudo -u makepkg -g makepkg /var/lib/makepkg/build/{{ item.name }}/build.sh || exit 1

          filename="$(</var/lib/makepkg/build/{{ item.name }}/pkgname)"

          name=$(pacman -Qi --file "${filename}" | grep '^Name' | awk '{print $3}')
          version=$(pacman -Qi --file "${filename}" | grep '^Version' | awk '{print $3}')

          if [[ "$(pacman -Q "${name}")" == "${name} ${version}" ]] ; then
            exit 0
          else
            pacman --upgrade --needed --noconfirm "$filename" || exit 1
            exit 123
          fi
      become: true
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Build and install aur package
      ansible.builtin.command: /var/lib/makepkg/build/{{ item.name }}/install.sh
      register: aur_install
      changed_when: aur_install.rc == 123
      failed_when: aur_install.rc not in (0, 123)
      become: true
      loop: "{{ aur_packages }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Clean up build leftovers
      ansible.builtin.file:
        path: /var/lib/makepkg/build/{{ item[0].name }}/{{ item[1] }}/
        state: absent
      become_user: makepkg
      become: true
      with_nested:
        - "{{ aur_packages }}"
        - - build
          - src
      loop_control:
        label: "{{ item[0].name }}/{{ item[1] }}"

[package]
name = "blocks"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
sha3 = { version = "0.12", default-features = false }
derive_more = { version = "2", default-features = false, features = [
  "display",
] }
tracing = { version = "0.1", default-features = false }
anyhow = { version = "1", default-features = false, features = [
  "std",
  "backtrace",
] }
camino = { version = "1", default-features = false, features = [] }
tokio = { version = "1", default-features = false, features = [
  "fs",
  "io-util",
  "process",
] }
tokio-stream = { version = "0.1", default-features = false, features = ["fs"] }
tap = { version = "1", default-features = false }
maybeowned = { path = "../maybeowned/" }

[lints]
workspace = true

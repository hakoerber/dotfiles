[workspace]
members = [
  "blocks",
  "maybeowned",
  "oxidizer",
  "oxidizer-core",
  "oxidizer-resources",
]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
anyhow = { version = "1", default-features = false, features = [
  "std",
  "backtrace",
] }
tracing = { version = "0.1", default-features = false }
include_dir = { version = "0.7", default-features = false }
tokio = { version = "1", default-features = false, features = [] }
tap = { version = "1", default-features = false }

[workspace.package]
version = "0.1.0"
edition = "2024"

[package]
name = "cfg"
version.workspace = true
edition.workspace = true

[lib]
name = "cfg"
path = "src/lib.rs"

[[bin]]
name = "cfg"
path = "src/main.rs"

[features]
testing = []

[profile.release]
opt-level = 3
strip = false
lto = true
codegen-units = 1
panic = "unwind"

[dependencies]
maybeowned = { path = "./maybeowned/" }
oxidizer = { path = "./oxidizer/" }
clap = { version = "4", default-features = false, features = [
  "std",
  "derive",
  "color",
  "help",
  "usage",
  "error-context",
] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tera = { version = "2", default-features = false }
dedent = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "ansi",
] }
paste = { version = "1", default-features = false }
strum = { version = "0.28", default-features = false, features = ["derive"] }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
include_dir = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[build-dependencies]
tempfile = { version = "3", default-features = false }

[lints]
workspace = true

[workspace.lints.clippy]
# enabled groups
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# pedantic overrides
too_many_lines = "allow"
must_use_candidate = "allow"
map_unwrap_or = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
if_not_else = "allow"
similar_names = "allow"
redundant_else = "allow"
redundant_closure_for_method_calls = "allow"
needless_raw_string_hashes = "allow"
bool_to_int_with_if = "allow"
single_match_else = "allow"

# nursery overrides
missing_const_for_fn = "allow"
option_if_let_else = "allow"
redundant_pub_crate = "allow"
trivial_regex = "allow"

# complexity overrides
too_many_arguments = "allow"

# style overrides
new_without_default = "allow"
redundant_closure = "allow"

# cargo overrides
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

# selected restrictions
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
create_dir = "allow"
dbg_macro = "warn"
decimal_literal_representation = "warn"
default_numeric_fallback = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
filetype_is_file = "warn"
float_arithmetic = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
infinite_loop = "warn"
inline_asm_x86_att_syntax = "warn"
inline_asm_x86_intel_syntax = "warn"
integer_division = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
little_endian_bytes = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
mixed_read_write_in_expression = "warn"
modulo_arithmetic = "warn"
multiple_inherent_impl = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
panic = "warn"
partial_pub_fields = "warn"
pattern_type_mismatch = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
self_named_module_files = "warn"
semicolon_inside_block = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
string_slice = "warn"
suspicious_xor_used_as_pow = "warn"
tests_outside_test_module = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unneeded_field_pattern = "allow"
unseparated_literal_suffix = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
use_debug = "warn"
verbose_file_reads = "warn"

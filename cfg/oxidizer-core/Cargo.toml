[package]
name = "oxidizer-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
maybeowned = { path = "../maybeowned/" }
blocks = { path = "../blocks/" }
anyhow = { workspace = true }
owo-colors = { version = "4", default-features = false }
async-trait = { version = "0.1", default-features = false }
async-scoped = { version = "0.9", default-features = false, features = [
  "use-tokio",
] }

[lints]
workspace = true
